# Application name
spring.application.name=carpark-api

# Server configuration
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/carpark_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore
spring.datasource.username=carpark_user
spring.datasource.password=carpark_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging configuration
logging.level.root=INFO
logging.level.com.wego.carpark=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson configuration
spring.jackson.default-property-inclusion=non_null

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Virtual Threads (Green Threads) Configuration
# Enable virtual threads for Spring MVC (available in Spring Boot 3.2+)
# This makes all web requests use virtual threads instead of platform threads
spring.threads.virtual.enabled=true

# Tomcat thread configuration (for monitoring)
# With virtual threads, these limits are less critical as threads are lightweight
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
